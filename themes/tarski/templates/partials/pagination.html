{% if articles_page and articles_paginator.num_pages > 1 %}
<div class="pagination">
  {% if articles_page.has_previous() %}
  <span class="newer"><a href="{{ SITEURL }}/{{ articles_previous_page.url }}">&laquo; Newer posts</a></span>
  {% endif %}
  <span class="page-count">Page {{ articles_page.number }} of {{ articles_paginator.num_pages }}</span>
  {% if articles_page.has_next() %}
  <span class="older"><a href="{{ SITEURL }}/{{ articles_next_page.url }}">Older posts &raquo;</a></span>
  {% endif %}
</div>
{% endif %}
